[package]
name = "face_lookup"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.22.1", features = ["wgpu", "cuda", "metal", "autodiff", "store", "train", "tui"] }
image = "0.25.10"

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIDER FACE · Dataset</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151d;color:#e9edf4}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 8px}p{color:#aab6c8}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 0;border-block:1px solid #303b4b;margin:24px 0}button,select,input[type=number]{font:inherit;color:inherit;background:#202c3c;border:1px solid #46556b;border-radius:7px;padding:8px 12px}button{cursor:pointer}button:hover:enabled{background:#30425c}button:disabled{opacity:.4;cursor:default}input[type=number]{width:88px}input[type=checkbox]{accent-color:#28e678}label{display:inline-flex;align-items:center;gap:8px}form{display:flex;align-items:center;gap:8px}.legend{font-size:13px}.valid{color:#28e678}.invalid{color:#ffb428}#status{min-height:24px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}article{background:#19222f;border:1px solid #303b4b;border-radius:10px;overflow:hidden}article a{display:block;background:#090d13}article img{display:block;width:100%;height:260px;object-fit:contain}article footer{padding:14px}article h2{font-size:13px;font-weight:500;overflow-wrap:anywhere;margin:0 0 8px}article p{font-size:13px;margin:0}.image-error{padding:24px;color:#ffb428}a{color:inherit}:focus-visible{outline:2px solid #80baff;outline-offset:3px}@media(max-width:480px){main{padding:20px 12px}#grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><h1>WIDER FACE <span style="color:#8d9db3;font-weight:400">/ Train</span></h1><p>Parcourir les images et leurs annotations de visages.</p></header>
<div class="toolbar">
<button id="previous" type="button" disabled>← Précédente</button>
<form id="navigation"><label>Page <input id="page" type="number" min="1" value="1" required></label><span id="pages"></span><button type="submit">Aller</button></form>
<button id="next" type="button" disabled>Suivante →</button>
<label>Par page <select id="size"><option>12</option><option>24</option><option>48</option></select></label>
<label><input id="boxes" type="checkbox" checked> Zones des visages</label>
<span class="legend"><span class="valid">■ Valide</span> · <span class="invalid">■ Marquée invalide</span></span>
</div>
<div class="toolbar">
<label>Poids <select id="weights"><option value="">Sans prédictions</option></select></label>
<button id="refresh-weights" type="button">Actualiser les poids</button>
<label>Seuil de confiance <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.5"></label>
<span class="legend"><span style="color:#ff4141">■ Prédictions</span> · <span class="valid">■ Annotations</span></span>
<span id="weights-status" role="status"></span>
</div>
<p id="status" role="status" aria-live="polite">Chargement…</p>
<div id="grid" aria-busy="true"></div>
<noscript>Activez JavaScript pour parcourir le dataset.</noscript>
</main>
<script>
const $ = id => document.getElementById(id);
let renderVersion = 0;
let currentPage = 1, totalPages = 0, entries = [], loading = false;
function controls() {
  $('previous').disabled = loading || currentPage <= 1;
  $('next').disabled = loading || currentPage >= totalPages;
  $('navigation').querySelector('button').disabled = loading || totalPages === 0;
  $('page').disabled = loading || totalPages === 0;
  $('size').disabled = loading;
}
function render() {
  const version = ++renderVersion;
  $('grid').replaceChildren();
  for (const entry of entries) {
    const card = document.createElement('article');
    const link = document.createElement('a');
    const weights = $('weights').value;
    const query = new URLSearchParams({weights, threshold: $('threshold').value, annotations: $('boxes').checked});
    link.href = weights ? `/api/train/${entry.id}/predicted?${query}` : ($('boxes').checked ? entry.annotated_image_url : entry.image_url);
    link.target = '_blank'; link.rel = 'noopener';
    link.title = 'Ouvrir l’image en taille réelle';
    const img = document.createElement('img');
    img.alt = entry.image_file_path; img.loading = 'lazy'; img.decoding = 'async';
    if (!weights) img.src = link.href;
    else {
      const pending = document.createElement('p'); pending.textContent = 'Calcul des prédictions…';
      link.append(pending);
      fetch(link.href).then(async response => {
        if (!response.ok) { const body = await response.json(); throw new Error(body.error || 'Inférence impossible'); }
        const blob = await response.blob();
        if (version !== renderVersion) return;
        const url = URL.createObjectURL(blob);
        img.onload = () => { URL.revokeObjectURL(url); pending.remove(); };
        img.src = url;
      }).catch(error => {
        if (version !== renderVersion) return;
        pending.className = 'image-error'; pending.textContent = error.message;
        img.remove();
      });
    }
    img.addEventListener('error', () => {
      const message = document.createElement('p');
      message.className = 'image-error'; message.textContent = 'Image indisponible';
      link.replaceChildren(message);
    });
    link.append(img);
    const footer = document.createElement('footer');
    const title = document.createElement('h2'); title.textContent = entry.image_file_path;
    const count = document.createElement('p');
    count.textContent = `#${entry.id} · ${entry.faces.length} visage(s) · ${entry.faces.filter(f => f.invalid !== 0).length} invalide(s)`;
    footer.append(title, count); card.append(link, footer); $('grid').append(card);
  }
}
async function load(page) {
  if (loading) return;
  loading = true; controls(); $('grid').setAttribute('aria-busy', 'true');
  $('status').textContent = 'Chargement…';
  try {
    const response = await fetch(`/api/train?page=${page}&page_size=${$('size').value}`);
    if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
    const data = await response.json();
    currentPage = data.page; totalPages = data.total_pages; entries = data.items;
    $('page').value = currentPage; $('page').max = Math.max(1, totalPages);
    $('pages').textContent = `/ ${totalPages}`;
    $('status').textContent = data.total === 0 ? 'Le dataset est vide.' : `${data.total.toLocaleString('fr-FR')} images · page ${currentPage} sur ${totalPages} · Cliquez sur une image pour l’agrandir.`;
    render();
  } catch (error) {
    entries = []; render(); $('status').textContent = `${error.message}. Réessayez avec les contrôles de pagination ou rechargez la page.`;
  } finally {
    loading = false; controls(); $('grid').setAttribute('aria-busy', 'false');
  }
}
$('previous').addEventListener('click', () => load(currentPage - 1));
$('next').addEventListener('click', () => load(currentPage + 1));
$('navigation').addEventListener('submit', event => { event.preventDefault(); if ($('navigation').reportValidity()) load(Number($('page').value)); });
$('size').addEventListener('change', () => load(1));
$('boxes').addEventListener('change', render);
async function refreshWeights() {
  const previous = $('weights').value;
  try {
    const response = await fetch('/api/weights');
    if (!response.ok) throw new Error('Impossible de lister les poids');
    const files = await response.json();
    $('weights').replaceChildren(new Option('Sans prédictions', ''));
    for (const file of files) $('weights').add(new Option(file, file));
    if (files.includes(previous)) $('weights').value = previous;
    $('weights-status').textContent = files.length ? `${files.length} fichier(s) disponible(s) dans runs` : 'Aucun fichier .bpk dans runs.';
    render();
  } catch (error) { $('weights-status').textContent = error.message; }
}
$('weights').addEventListener('change', render);
$('threshold').addEventListener('change', () => { if ($('threshold').reportValidity()) render(); });
$('refresh-weights').addEventListener('click', refreshWeights);
refreshWeights();
load(1);
</script>
</body>
</html>
